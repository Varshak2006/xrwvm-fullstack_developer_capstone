services:
  mongo_db:
    container_name: db_container
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db

  api:
    container_name: dealership_api
    build:
      context: .
      dockerfile: database/Dockerfile
    ports:
      - "3030:3030"
    depends_on:
      - mongo_db
    restart: always

volumes:
  mongo_data:
